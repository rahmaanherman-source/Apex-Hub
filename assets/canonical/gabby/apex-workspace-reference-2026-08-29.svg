<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <title>APEX Workspace Visual Cartography — Whole Picture / No Clipping</title>
  <desc>Canonical engineering map derived from the user-provided August 29 2026 workspace screenshot. The implementation must preserve all content and provide horizontal navigation rather than crop content.</desc>
  <rect width="1080" height="1440" fill="#0b1020"/>
  <rect x="20" y="20" width="1040" height="92" rx="18" fill="#141b31" stroke="#4c7dff" stroke-width="2"/>
  <text x="54" y="62" fill="#ffffff" font-family="Arial" font-size="24" font-weight="700">APEX WORKSPACE — WHOLE PICTURE</text>
  <text x="54" y="92" fill="#b9c8ef" font-family="Arial" font-size="16">Preserve content • scroll left/right • no destructive cropping</text>
  <rect x="20" y="132" width="190" height="1110" rx="18" fill="#11182b" stroke="#52658f"/>
  <text x="44" y="170" fill="#ffffff" font-family="Arial" font-size="20" font-weight="700">LEFT NAV</text>
  <text x="44" y="208" fill="#b9c8ef" font-family="Arial" font-size="15">Tabs</text>
  <text x="44" y="238" fill="#b9c8ef" font-family="Arial" font-size="15">Thumbnails</text>
  <text x="44" y="268" fill="#b9c8ef" font-family="Arial" font-size="15">Files</text>
  <text x="44" y="298" fill="#b9c8ef" font-family="Arial" font-size="15">Projects</text>
  <rect x="230" y="132" width="620" height="900" rx="18" fill="#151d33" stroke="#52658f"/>
  <text x="258" y="170" fill="#ffffff" font-family="Arial" font-size="20" font-weight="700">CENTER WORKSPACE</text>
  <text x="258" y="202" fill="#b9c8ef" font-family="Arial" font-size="15">All cards/items remain present even when outside the viewport.</text>
  <g fill="#2a3656" stroke="#6687d9">
    <rect x="258" y="250" width="170" height="130" rx="16"/>
    <rect x="448" y="250" width="170" height="130" rx="16"/>
    <rect x="638" y="250" width="170" height="130" rx="16"/>
    <rect x="258" y="405" width="170" height="130" rx="16"/>
    <rect x="448" y="405" width="170" height="130" rx="16"/>
    <rect x="638" y="405" width="170" height="130" rx="16"/>
  </g>
  <text x="300" y="322" fill="#ffffff" font-family="Arial" font-size="14">ITEM / CARD</text>
  <text x="490" y="322" fill="#ffffff" font-family="Arial" font-size="14">ITEM / CARD</text>
  <text x="680" y="322" fill="#ffffff" font-family="Arial" font-size="14">ITEM / CARD</text>
  <path d="M270 620 H805" stroke="#6d8fff" stroke-width="4"/>
  <path d="M270 620 l25 -15 v30 z M805 620 l-25 -15 v30 z" fill="#6d8fff"/>
  <text x="390" y="660" fill="#ffffff" font-family="Arial" font-size="17" font-weight="700">SWIPE / SCROLL LEFT ↔ RIGHT</text>
  <rect x="870" y="132" width="190" height="900" rx="18" fill="#11182b" stroke="#52658f"/>
  <text x="894" y="170" fill="#ffffff" font-family="Arial" font-size="20" font-weight="700">RIGHT CONTEXT</text>
  <text x="894" y="208" fill="#b9c8ef" font-family="Arial" font-size="15">Preserve it.</text>
  <text x="894" y="238" fill="#b9c8ef" font-family="Arial" font-size="15">Do not crop it.</text>
  <rect x="450" y="700" width="180" height="180" rx="90" fill="#103b9a" stroke="#9fd5ff" stroke-width="6"/>
  <circle cx="540" cy="790" r="65" fill="#1c6cff" opacity="0.75"/>
  <text x="490" y="796" fill="#ffffff" font-family="Arial" font-size="20" font-weight="700">GABBY</text>
  <text x="390" y="915" fill="#b9c8ef" font-family="Arial" font-size="15">ONE RUNTIME • ONE ORB • MUST NOT BLOCK WORK</text>
  <rect x="20" y="1060" width="1040" height="182" rx="18" fill="#11182b" stroke="#52658f"/>
  <text x="48" y="1100" fill="#ffffff" font-family="Arial" font-size="20" font-weight="700">BOTTOM WORKFLOW</text>
  <text x="48" y="1138" fill="#b9c8ef" font-family="Arial" font-size="15">Capture • Edit • Animate • Audio • Export • Share</text>
  <rect x="48" y="1160" width="250" height="52" rx="12" fill="#253252" stroke="#6d8fff"/>
  <text x="112" y="1193" fill="#ffffff" font-family="Arial" font-size="17" font-weight="700">WHOLE PICTURE</text>
  <text x="330" y="1193" fill="#ffffff" font-family="Arial" font-size="17">OVERVIEW → jump to any region</text>
  <text x="48" y="1290" fill="#ffdd7a" font-family="Arial" font-size="18" font-weight="700">FAIL CONDITION:</text>
  <text x="205" y="1290" fill="#ffffff" font-family="Arial" font-size="18">content removed/cropped because viewport is narrow</text>
  <text x="48" y="1330" fill="#8ff0b5" font-family="Arial" font-size="18" font-weight="700">PASS CONDITION:</text>
  <text x="205" y="1330" fill="#ffffff" font-family="Arial" font-size="18">everything remains reachable by navigation</text>
</svg>