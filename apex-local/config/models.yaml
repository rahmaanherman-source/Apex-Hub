local:
  default: qwen2.5-coder:7b
  coding: qwen2.5-coder:7b
  reasoning: qwen2.5-coder:7b
  creative: llama3.2:3b
  fast: llama3.2:3b
cloud:
  google: {model: gemini-2.0-flash, key_env: GOOGLE_AI_STUDIO_KEY, enabled: false}
  leonardo: {model: leonardo-creative, key_env: LEONARDO_API_KEY, enabled: false}
